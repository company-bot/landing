<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us - SyZentric EDU</title>
    <link rel="icon" type="image/png" sizes="64x64" href="/logo/favicon.png?v=2" />
    <link rel="icon" type="image/png" sizes="48x48" href="/logo/favicon.png?v=2" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Geist+Sans:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        obsidian: '#050510',
                        cyan: { DEFAULT: '#7B2C9E', glow: '#7B2C9E80' },
                        purple: { DEFAULT: '#4A1F62', glow: '#4A1F6280' }
                    },
                    fontFamily: {
                        sans: ['Geist Sans', 'sans-serif'],
                        display: ['Geist Sans', 'sans-serif'],
                        mono: ['Geist Mono', 'monospace'],
                    },
                    backgroundImage: {
                        'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
                    }
                }
            }
        }
    </script>
    <style>
        /* Font Rules */
        h1, h2, h3, h4, h5, h6 {
            font-weight: 700;
            letter-spacing: -0.03em;
        }

        body, p, div {
            font-weight: 400;
            line-height: 1.6;
        }

        button, .btn, .accent-text {
            font-family: 'Geist Mono', monospace;
        }

        /* Glass morphism styles */
        .glass-panel {
            background: rgba(243, 244, 246, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 0, 0, 0.15);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.08);
        }

        .dark .glass-panel {
            background: rgba(5, 5, 16, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .text-glow-cyan {
            text-shadow: 0 0 10px rgba(123, 44, 158, 0.5), 0 0 20px rgba(123, 44, 158, 0.3);
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/contact.tsx"></script>
</body>

</html>
